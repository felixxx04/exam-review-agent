[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-review-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiosqlite>=0.20.0,<1.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "chromadb>=0.5.0",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "argon2-cffi>=23.1.0,<26.0.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "pillow>=11.0.0",
    "numpy>=1.26.0,<3.0.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "certifi>=2024.12.14",
    "typing-extensions>=4.12.0",
    "python-magic>=0.4.27",
    "boto3>=1.35,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "bandit>=1.7.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "chroma_data*", "tests*", "uploads*"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = [".venv", "tests", "alembic", ".pytest_cache", "chroma_data"]
skips = ["B101"]

# Phase 0 gate: fail on medium/high findings. Phase 8 reviews low findings.
# Run security scan: bandit -r app/ -c pyproject.toml -ll
